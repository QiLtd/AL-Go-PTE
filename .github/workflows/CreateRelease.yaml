name: ' Create release'
run-name: "Create release - Version ${{ inputs.tag }}"

concurrency:
  group: ${{ github.workflow }}

on:
  workflow_dispatch:
    inputs:
      buildVersion:
        description: Build version to promote to release (default is latest)
        required: false
        default: 'latest'
      name:
        description: Name of this release
        required: true
        default: ''
      tag:
        description: Tag of this release (semantic version like 1.0.0, or incremental +1, +0.1, +0.0.1)
        required: true
        default: ''
      releaseType:
        description: Release, prerelease or draft?
        type: choice
        options:
          - Release
          - Prerelease
          - Draft
        default: Release
      createReleaseBranch:
        description: Create Release Branch?
        type: boolean
        default: false
      releaseBranchPrefix:
        description: The prefix for the release branch. Used only if 'Create Release Branch?' is checked.
        type: string
        default: release/
      updateVersionNumber:
        description: New Version Number in main branch. Use Major.Minor (optionally add .Build for versioningstrategy 3) for absolute change, or +1, +0.1 (or +0.0.1 for versioningstrategy 3) incremental change.
        required: false
        default: ''
      skipUpdatingDependencies:
        description: Skip updating dependency version numbers in all apps.
        type: boolean
        default: false
      directCommit:
        description: Direct Commit?
        type: boolean
        default: false
      useGhTokenWorkflow:
        description: Use GhTokenWorkflow for PR/Commit?
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: write

defaults:
  run:
    shell: powershell

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  CreateRelease:
    needs: [ ]
    runs-on: [ self-hosted ]
    outputs:
      artifacts: ${{ steps.determineArtifactsForRelease.outputs.artifacts }}
      releaseId: ${{ steps.createrelease.outputs.releaseId }}
      commitish: ${{ steps.determineArtifactsForRelease.outputs.commitish }}
      releaseVersion: ${{ steps.createreleasenotes.outputs.releaseVersion }}
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
    steps:
      - name: Dump Workflow Information
        uses: microsoft/AL-Go-Actions/DumpWorkflowInfo@v9.0
        with:
          shell: powershell

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v9.0
        with:
          shell: powershell

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.0
        with:
          shell: powershell
          get: templateUrl,repoName,type,powerPlatformSolutionFolder

      - name: Validate Workflow Input
        if: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.event.inputs.tag, '+') }}
        uses: microsoft/AL-Go-Actions/ValidateWorkflowInput@v9.0
        with:
          shell: powershell

      - name: Resolve tag input
        id: resolveTag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $tagInput = "$env:INPUT_TAG".Trim()
          if ([string]::IsNullOrWhiteSpace($tagInput)) {
            throw "Tag input cannot be empty."
          }
          if (-not $tagInput.StartsWith('+')) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tagInput"
            exit 0
          }
          if ($tagInput -notin @('+1', '+0.1', '+0.0.1')) {
            throw "Unsupported incremental tag value '$tagInput'. Supported values: +1, +0.1, +0.0.1"
          }
          $settingsPath = '.AL-Go/settings.json'
          if (-not (Test-Path $settingsPath)) {
            throw "Cannot resolve incremental tag: $settingsPath not found."
          }
          $settings = Get-Content -Raw -Path $settingsPath | ConvertFrom-Json
          $baseVersion = '1.0.0'
          if ($settings.PSObject.Properties.Name -contains 'repoVersion' -and -not [string]::IsNullOrWhiteSpace([string]$settings.repoVersion)) {
            $baseVersion = [string]$settings.repoVersion
          }
          $parts = $baseVersion.Split('.')
          if ($parts.Count -lt 2 -or $parts.Count -gt 3) {
            throw "repoVersion '$baseVersion' must be major.minor or major.minor.build to use incremental tag input."
          }
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $build = if ($parts.Count -eq 3) { [int]$parts[2] } else { 0 }
          switch ($tagInput) {
            '+1'     { $major++; $minor = 0; $build = 0 }
            '+0.1'   { $minor++; $build = 0 }
            '+0.0.1' { $build++ }
          }
          $resolvedTag = "$major.$minor.$build"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$resolvedTag"

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush,ghTokenWorkflow'
          useGhTokenWorkflowForPush: '${{ github.event.inputs.useGhTokenWorkflow }}'

      - name: Determine Projects
        id: determineProjects
        uses: microsoft/AL-Go-Actions/DetermineProjectsToBuild@v9.0
        with:
          shell: powershell

      - name: Check for updates to AL-Go system files
        uses: microsoft/AL-Go-Actions/CheckForUpdates@v9.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          templateUrl: ${{ env.templateUrl }}
          token: ${{ fromJson(steps.ReadSecrets.outputs.Secrets).ghTokenWorkflow }}
          downloadLatest: true

      - name: Determine artifacts for release
        uses: microsoft/AL-Go-Actions/DetermineArtifactsForRelease@v9.0
        id: determineArtifactsForRelease
        with:
          shell: powershell
          buildVersion: ${{ github.event.inputs.buildVersion }}
          GITHUB_TOKEN: ${{ github.token }}
          TOKENFORPUSH: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          ProjectsJson: ${{ steps.determineProjects.outputs.ProjectsJson }}

      - name: Prepare release notes
        id: createreleasenotes
        uses: microsoft/AL-Go-Actions/CreateReleaseNotes@v9.0
        with:
          shell: powershell
          buildVersion: ${{ github.event.inputs.buildVersion }}
          tag_name: ${{ steps.resolveTag.outputs.tag }}
          target_commitish: ${{ steps.determineArtifactsForRelease.outputs.commitish }}

      - name: Create release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: createrelease
        env:
          bodyMD: ${{ steps.createreleasenotes.outputs.releaseNotes }}
          tag_name: ${{ steps.resolveTag.outputs.tag }}
          name: ${{ github.event.inputs.name }}
          releaseType: ${{ github.event.inputs.releaseType }}
          prerelease: ${{ github.event.inputs.releaseType == 'Prerelease' }}
          commitish: ${{ steps.determineArtifactsForRelease.outputs.commitish }}
        with:
          github-token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          script: |
            var bodyMD = process.env.bodyMD
            const createReleaseResponse = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.tag_name,
              name: process.env.name,
              body: bodyMD.replaceAll('\\n','\n').replaceAll('%0A','\n').replaceAll('%0D','\n').replaceAll('%25','%'),
              draft: (process.env.releaseType == 'Draft'),
              prerelease: (process.env.releaseType == 'Prerelease'),
              make_latest: 'legacy',
              target_commitish: process.env.commitish
            });
            const {
              data: { id: releaseId, html_url: htmlUrl, upload_url: uploadUrl }
            } = createReleaseResponse;
            core.setOutput('releaseId', releaseId);

  UploadArtifacts:
    needs: [ CreateRelease ]
    runs-on: [ self-hosted ]
    name: Upload ${{ matrix.name }}
    strategy:
      matrix: ${{ fromJson(needs.CreateRelease.outputs.artifacts) }}
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.0
        with:
          shell: powershell

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'nuGetContext,storageContext,TokenForPush'
          useGhTokenWorkflowForPush: '${{ github.event.inputs.useGhTokenWorkflow }}'

      - name: Download artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_URL: ${{ matrix.url }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          Write-Host "Downloading artifact $ENV:MATRIX_NAME"
          $headers = @{
            "Authorization" = "token $ENV:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "Accept" = "application/vnd.github+json"
          }
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri $ENV:MATRIX_URL -OutFile "$($ENV:MATRIX_NAME).zip"

      - name: Upload release artifacts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          releaseId: ${{ needs.createrelease.outputs.releaseId }}
          MATRIX_NAME: ${{ matrix.name }}
        with:
          github-token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          script: |
            const releaseId = process.env.releaseId
            const matrixName = process.env.MATRIX_NAME
            const assetPath = `${matrixName}.zip`
            const assetName = encodeURIComponent(`${matrixName}.zip`.replaceAll(' ','.')).replaceAll('%','')
            const fs = require('fs');
            const uploadAssetResponse = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: assetName,
              data: fs.readFileSync(assetPath)
            });

      - name: Extract and upload .app file
        env:
          releaseId: ${{ needs.createrelease.outputs.releaseId }}
          MATRIX_NAME: ${{ matrix.name }}
          GITHUB_TOKEN: ${{ steps.ReadSecrets.outputs.TokenForPush }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $zipFile = "$($ENV:MATRIX_NAME).zip"
          $extractPath = ".\release-extract"
          
          # Extract the zip file
          Write-Host "Extracting $zipFile to $extractPath"
          if (Test-Path $extractPath) { Remove-Item -Recurse -Force $extractPath }
          Expand-Archive -Path $zipFile -DestinationPath $extractPath -Force
          
          # Find all .app files recursively
          $appFiles = @(Get-ChildItem -Path $extractPath -Filter "*.app" -Recurse)
          
          if ($appFiles.Count -gt 0) {
            Write-Host "Found $($appFiles.Count) .app file(s)"
            
            foreach ($appFile in $appFiles) {
              $appFileName = $appFile.Name
              Write-Host "Uploading .app file: $appFileName"
              
              # Use gh CLI to upload release asset
              $releaseId = $ENV:releaseId
              $repoUrl = "https://api.github.com/repos/${{ github.repository }}/releases/$releaseId/assets"
              
              $headers = @{
                "Authorization" = "token $($ENV:GITHUB_TOKEN)"
                "X-GitHub-Api-Version" = "2022-11-28"
                "Content-Type" = "application/octet-stream"
              }
              
              $fileContent = [System.IO.File]::ReadAllBytes($appFile.FullName)
              $uploadResponse = Invoke-WebRequest -UseBasicParsing `
                -Headers $headers `
                -Uri "$repoUrl`?name=$([System.Uri]::EscapeDataString($appFileName))" `
                -Method POST `
                -Body $fileContent
              
              Write-Host "✓ Uploaded: $appFileName (ID: $($uploadResponse.Content | ConvertFrom-Json | Select-Object -ExpandProperty id))"
            }
          } else {
            Write-Host "⚠ No .app files found in artifact"
          }
          
          # Clean up
          Remove-Item -Recurse -Force $extractPath

      - name: Deliver to NuGet
        uses: microsoft/AL-Go-Actions/Deliver@v9.0
        if: ${{ fromJson(steps.ReadSecrets.outputs.Secrets).nuGetContext != '' }}
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: powershell
          type: 'Release'
          projects: ${{ matrix.project }}
          deliveryTarget: 'NuGet'
          artifacts: ${{ github.event.inputs.buildVersion }}
          atypes: 'Apps,TestApps'

      - name: Deliver to Storage
        uses: microsoft/AL-Go-Actions/Deliver@v9.0
        if: ${{ fromJson(steps.ReadSecrets.outputs.Secrets).storageContext != '' }}
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: powershell
          type: 'Release'
          projects: ${{ matrix.project }}
          deliveryTarget: 'Storage'
          artifacts: ${{ github.event.inputs.buildVersion }}
          atypes: 'Apps,TestApps,Dependencies'

  CreateReleaseBranch:
    needs: [ CreateRelease, UploadArtifacts ]
    if: ${{ github.event.inputs.createReleaseBranch=='true' }}
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: '${{ needs.createRelease.outputs.commitish }}'

      - name: Create Release Branch
        env:
          releaseBranchPrefix: ${{ github.event.inputs.releaseBranchPrefix }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $releaseBranch = "$($env:releaseBranchPrefix)" + "${{ needs.CreateRelease.outputs.releaseVersion }}"
          Write-Host "Creating release branch $releaseBranch"
          git checkout -b $releaseBranch
          git config user.name ${{ github.actor}}
          git config user.email ${{ github.actor}}@users.noreply.github.com
          git commit --allow-empty -m "Release branch $releaseBranch"
          git push origin $releaseBranch

  UpdateVersionNumber:
    needs: [ CreateRelease, UploadArtifacts ]
    if: ${{ github.event.inputs.updateVersionNumber!='' }}
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.0
        with:
          shell: powershell

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush'
          useGhTokenWorkflowForPush: '${{ github.event.inputs.useGhTokenWorkflow }}'

      - name: Update Version Number
        uses: microsoft/AL-Go-Actions/IncrementVersionNumber@v9.0
        with:
          shell: powershell
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          versionNumber: ${{ github.event.inputs.updateVersionNumber }}
          skipUpdatingDependencies: ${{ github.event.inputs.skipUpdatingDependencies }}
          directCommit: ${{ github.event.inputs.directCommit }}

  PostProcess:
    needs: [ CreateRelease, UploadArtifacts, CreateReleaseBranch, UpdateVersionNumber ]
    if: always()
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Finalize the workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v9.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          telemetryScopeJson: ${{ needs.CreateRelease.outputs.telemetryScopeJson }}
          currentJobContext: ${{ toJson(job) }}
